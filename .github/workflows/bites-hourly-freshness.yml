name: Bites Hourly Freshness

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bites-hourly-freshness
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger authenticated Bites hourly freshness
        shell: bash
        env:
          BITES_CRON_SECRET: ${{ secrets.BITES_CRON_SECRET }}
        run: |
          set -euo pipefail

          test -n "${BITES_CRON_SECRET}"

          response="$(mktemp)"
          code="$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 15 \
              --max-time 60 \
              --output "${response}" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer ${BITES_CRON_SECRET}" \
              "https://lumoraverse.io/api/fyp/hourly-freshness"
          )"

          echo "HTTP=${code}"

          test "${code}" = "200"

          node - "${response}" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const body = JSON.parse(fs.readFileSync(file, "utf8"));

          const checks = {
            ok: body.ok === true,
            runtime:
              body.runtime === "bites_live_hourly_execution_v1",
            cadence:
              body.cadenceHours === 1,
            blindPublication:
              body.execution?.blindPublication === false,
            externalNetworkAcquisition:
              body.execution?.externalNetworkAcquisition === false,
            scraping:
              body.execution?.scraping === false,
            unauthorizedDownload:
              body.execution?.unauthorizedDownload === false,
            unauthorizedRehosting:
              body.execution?.unauthorizedRehosting === false,
            protectedInventory:
              Number(body.protectedInventory?.externalCount || 0) >= 981,
          };

          let failures = 0;

          for (const [name, ok] of Object.entries(checks)) {
            console.log(`${name}=${ok ? "PASS" : "FAIL"}`);
            if (!ok) failures++;
          }

          if (failures) {
            process.exit(7);
          }
NODE

          rm -f "${response}"

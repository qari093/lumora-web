name: Bites Hourly Freshness

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Bites freshness
        shell: bash
        env:
          BITES_CRON_SECRET: ${{ secrets.BITES_CRON_SECRET }}
        run: |
          set -euo pipefail

          test -n "${BITES_CRON_SECRET:-}"

          RESPONSE="$(mktemp)"

          HTTP="$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 15 \
              --max-time 60 \
              --output "${RESPONSE}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${BITES_CRON_SECRET}" \
              "https://lumoraverse.io/api/fyp/hourly-freshness"
          )"

          echo "HTTP=${HTTP}"

          test "${HTTP}" = "200"

          grep -q '"ok":true' "${RESPONSE}"
          echo "ok=PASS"

          grep -q '"runtime":"bites_live_hourly_execution_v1"' "${RESPONSE}"
          echo "runtime=PASS"

          grep -q '"cadenceHours":1' "${RESPONSE}"
          echo "cadence=PASS"

          grep -q '"blindPublication":false' "${RESPONSE}"
          echo "blindPublication=PASS"

          grep -q '"externalNetworkAcquisition":false' "${RESPONSE}"
          echo "externalNetworkAcquisition=PASS"

          grep -q '"scraping":false' "${RESPONSE}"
          echo "scraping=PASS"

          grep -q '"unauthorizedDownload":false' "${RESPONSE}"
          echo "unauthorizedDownload=PASS"

          grep -q '"unauthorizedRehosting":false' "${RESPONSE}"
          echo "unauthorizedRehosting=PASS"

          rm -f "${RESPONSE}"

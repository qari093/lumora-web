name: CI - Tests

on:
  push:
    branches: [lumora-launch-final, main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Creator CineVerse GMAR tests
        run: pnpm -s vitest run tests/creator-cineverse-gmar --reporter verbose

      - name: Megapack runtime tests
        run: pnpm -s vitest run tests/civilization/civilization_foundation.test.ts tests/atmosphere/atmosphere_runtime.test.ts tests/fyp/fyp_runtime.test.ts tests/continuity/tomorrows_vibe.test.ts tests/portal/portal_runtime.test.ts tests/vault/vault_engine.test.ts tests/live-social tests/creator-cineverse-gmar --reporter verbose

      - name: Typecheck
        run: pnpm -s tsc --noEmit

name: LumaSpace State & Tests

on:
  push:
    branches: [lumora-launch-final, main]
  pull_request:

jobs:
  lumaspace-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: LumaSpace state contract
        run: pnpm -s vitest run tests/lumaspace --reporter verbose --passWithNoTests --pool=forks --poolOptions.forks.singleFork=true

      - name: Typecheck
        run: pnpm -s tsc --noEmit
